/* ---------- Content (from the question bank and deck) ---------- */
const PATHWAYS = {
  A: { key: "manufacturing", name: "Manufacturing-led", hex: "#B9640A", video: "videos/manufacturing-led.mp4" },
  B: { key: "productivity", name: "Productivity-led", hex: "#0B7A7C", video: "videos/productivity-led.mp4" },

// Weights 1, 2, 4, 8, 16: each exceeds the sum of all earlier weights, so totals can never tie.
const QUESTIONS = [
  {
    weight: 1,
    text: "Where should the city invest first?",
    options: {
      A: "Industrial estates and freight links for factories and markets.",
      B: "Citywide transport, utilities and digital networks that lower business costs.",
      C: "Public spaces, urban services and amenities that attract people and firms."
    }
  },
  {
    weight: 2,
    text: "What should the city offer a major new employer?",
    options: {
      A: "Ready industrial land, production facilities and local suppliers.",
      B: "Low operating costs, reliable utilities and fast approvals.",
      C: "Quality housing, urban services and international connectivity."
    }
  },
  {
    weight: 4,
    text: "How should the city address youth unemployment?",
    options: {
      A: "Technical and vocational training for factory and trade jobs.",
      B: "Digital and management skills for existing businesses.",
      C: "Higher education and professional skills for finance, IT and services."
    }
  },
  {
    weight: 8,
    text: "How should the city support small and medium businesses?",
    options: {
      A: "Connect them to larger manufacturers and supply chains.",
      B: "Help them adopt technology, train staff and improve processes.",
      C: "Help them enter design, professional and knowledge-based services."
    }
  },
  {
    weight: 16,
    text: "What economic identity should Ahmedabad build?",
    options: {
      A: "A manufacturing and export hub with strong supply chains.",
      B: "An efficient, technology-enabled economy with low business costs.",
      C: "A services hub for finance, specialised services and global links."
    }
  }
];

const CODES = ["A", "B", "C"];

/* ---------- Helpers ---------- */
const shuffle = (list) => {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const makeOrders = () => QUESTIONS.map(() => shuffle(CODES));
const emptyAnswers = () => Array(QUESTIONS.length).fill(null);

function winningCode(answers) {
  const totals = { A: 0, B: 0, C: 0 };
  answers.forEach((code, i) => {
    if (code) totals[code] += QUESTIONS[i].weight;
  });
  return CODES.reduce((best, c) => (totals[c] > totals[best] ? c : best), CODES[0]);
}

function readGameUrl() {
  try {
    const saved = localStorage.getItem(LINK_KEY);
    if (saved) return saved;
  } catch (e) {}
  return /^https?:/.test(window.location.protocol) ? window.location.href.split("#")[0] : "";
}

function QRCard() {
  const [url, setUrl] = useState(readGameUrl);
  const [img, setImg] = useState("");
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState("");

  useEffect(() => {
    let alive = true;
    if (!url || typeof QRCode === "undefined") {
      setImg("");
      return;
    }
    QRCode.toDataURL(url, { width: 240, margin: 1, errorCorrectionLevel: "M", color: { dark: "#0B2A5B", light: "#FFFFFF" } })
      .then((d) => { if (alive) setImg(d); })
      .catch(() => { if (alive) setImg(""); });
    return () => { alive = false; };
  }, [url]);

  const saveLink = (e) => {
    e.preventDefault();
    const v = draft.trim();
    try {
      if (v) localStorage.setItem(LINK_KEY, v);
      else localStorage.removeItem(LINK_KEY);
    } catch (err) {}
    setUrl(readGameUrl());
    setEditing(false);
  };

  return (
    <div className="flex flex-col items-center gap-5 sm:flex-row">
      <div className="flex h-44 w-44 shrink-0 items-center justify-center rounded-2xl border border-line bg-white p-2">
        {img ? (
          <img src={img} alt="QR code to open the game on a phone" className="h-full w-full" />
        ) : (
          <span className="px-3 text-center text-xs leading-snug text-muted">Set the game link to create a QR code</span>
        )}
      </div>
      <div className="max-w-xs text-center sm:text-left">
        <p className="text-base font-bold text-navy">Play on your phone</p>
        <p className="text-sm text-muted">Scan the code to open the game.</p>
        {editing ? (
          <form onSubmit={saveLink} className="mt-3 flex flex-col gap-2 sm:flex-row">
            <input
              type="url"
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              placeholder="https://your-site.example.com"
              aria-label="Deployed game link"
              className="min-h-[46px] w-full rounded-xl border-2 border-line px-3 text-sm focus:border-teal focus:outline-none"
            />
            <button type="submit" className="min-h-[46px] rounded-xl bg-teal px-5 text-sm font-bold text-white hover:opacity-90">Save</button>
          </form>
        ) : (
          <button
            type="button"
            onClick={() => { setDraft(url); setEditing(true); }}
            className="mt-2 min-h-[44px] text-sm font-bold text-teal underline underline-offset-4"
          >
            Set game link
          </button>
        )}
      </div>
    </div>
  );
}

      className="relative isolate flex min-h-[80vh] flex-col overflow-hidden bg-white"
    >
      <div aria-hidden="true" className="pointer-events-none absolute -left-32 -top-24" style={par(-30)}>
        <div className="anim-drift h-96 w-96 rounded-full bg-tealL/30 blur-3xl" />
      </div>
      <div aria-hidden="true" className="pointer-events-none absolute -right-32 top-1/3" style={par(40)}>
        <div className="anim-drift h-96 w-96 rounded-full bg-navy/10 blur-3xl" style={{ animationDelay: "-5s" }} />
      </div>
      <div aria-hidden="true" className="pointer-events-none absolute -bottom-24 -right-16" style={par(-20)}>
        <div className="anim-drift h-80 w-80 rounded-full bg-orangeL/25 blur-3xl" style={{ animationDelay: "-9s" }} />
      </div>

      <div className="relative z-10 mx-auto flex w-full max-w-4xl flex-col items-center px-6 pt-10 text-center animate-fade-up">
        <p className="stagger-in text-2xl font-extrabold tracking-tight text-navy md:text-4xl">City Economic Development Studio</p>
        <img src={LOGO_SRC} alt="CEPT University, Faculty of Management" className="anim-float mt-4 h-9 w-auto md:h-11" />
        <div className="mt-6 h-1 w-40 origin-center rounded-full bg-teal stagger-in" style={{ animationDelay: "120ms" }} />
        <h1 className="mt-10 text-4xl font-extrabold leading-[1.12] tracking-tight text-navy md:text-6xl">
          {words.map((w, i) => (
            <span
              key={i}
              className={`stagger-in mr-[0.25em] inline-block ${i === 3 || i === 4 ? "text-teal" : ""}`}
              style={{ animationDelay: `${200 + i * 70}ms` }}
            >
              {w}
            </span>
          ))}
        </h1>
        <p className="stagger-in mt-6 max-w-xl text-lg text-muted md:text-xl" style={{ animationDelay: "1100ms" }}>
          Answer five quick questions and see which pathway you would choose.
        </p>
        <button
          type="button"
          onClick={onStart}
          className="anim-pulse stagger-in group relative mt-10 inline-flex min-h-[72px] items-center justify-center gap-3 overflow-hidden rounded-full bg-orange px-10 text-xl font-bold text-white transition duration-300 hover:-translate-y-1 hover:scale-[1.03] md:px-14 hover:bg-orangeDark active:scale-[0.98]"
          style={{ animationDelay: "1300ms" }}
        >
          <span aria-hidden="true" className="anim-shine pointer-events-none absolute inset-y-0 left-0 w-1/3 bg-gradient-to-r from-transparent via-white/40 to-transparent" />
          <span className="relative">Start Game</span>
          <ArrowRight className="relative transition duration-300 group-hover:translate-x-1" />
        </button>
      </div>

      <div className="relative z-10 mx-auto mt-auto flex w-full max-w-5xl flex-col gap-8 px-6 pb-28 pt-10 md:flex-row md:items-end md:justify-between">
        <div className="stagger-in border-l-4 border-teal pl-4 text-left text-sm" style={{ animationDelay: "1500ms" }}>
          <p className="font-bold text-navy">Faculty of Management · CEPT University</p>
          <p className="mt-1 font-semibold text-ink">Tutor: Dr. Astha Agarwalla · Co-Tutors: Mr. Utkarsh, Ms. Hricha</p>
          <p className="text-muted">Teaching Assistants: Mr. Rahul, Mr. Advait</p>
        </div>
      </div>

      <div aria-hidden="true" className="pointer-events-none absolute inset-x-0 bottom-0 z-0 flex origin-bottom scale-[0.6] items-end justify-center gap-3 px-6 md:scale-100">
        {bars.map((b, i) => (
          <span
            key={i}
            className={`anim-grow w-7 rounded-t-lg md:w-9 ${b.c}`}
            style={{ height: `${b.h}px`, animationDelay: `${300 + i * 80}ms` }}
          />
        ))}
      </div>
    </div>
  );
}

/* ---------- Quiz ---------- */
function Quiz({ index, answers, order, locked, onChoose, onBack }) {
  const q = QUESTIONS[index];
  const picked = answers[index];
  const answered = answers.filter(Boolean).length;
  const pct = (answered / QUESTIONS.length) * 100;

  return (
    <div className="mx-auto max-w-5xl">
      <div className="flex items-center justify-between gap-4">
        <button
          type="button"
          onClick={onBack}
          disabled={index === 0 || locked}
          className="inline-flex min-h-[52px] items-center gap-2 rounded-full border-2 border-navy px-6 font-bold text-navy transition hover:bg-navy hover:text-white disabled:pointer-events-none disabled:opacity-35"
        >
          <ArrowLeft /> Back
        </button>
        <p className="text-sm font-bold uppercase tracking-widest text-teal">
          Question {index + 1} of {QUESTIONS.length}
        </p>
      </div>

      <div
        role="progressbar"
        aria-label="Progress"
        aria-valuemin={0}
        aria-valuemax={QUESTIONS.length}
        aria-valuenow={answered}
        className="mt-6 h-3 w-full overflow-hidden rounded-full bg-line"
      >
        <div
          className="h-full rounded-full bg-gradient-to-r from-teal to-orange transition-[width] duration-500 ease-out"
          style={{ width: `${pct}%` }}
        />
      </div>

      <div key={index} className="animate-fade-up mt-10 md:mt-14">
        <h2 className="text-center text-3xl font-extrabold leading-tight tracking-tight text-navy md:text-5xl">
          {q.text}
        </h2>

        <div className="mt-10 grid gap-4 md:grid-cols-3 md:gap-5">
          {order.map((code, pos) => {
            const selected = picked === code;
            return (
              <button
                key={code}
                type="button"
                onClick={() => onChoose(code)}
                disabled={locked}
                aria-pressed={selected}
                style={{ animationDelay: `${pos * 90}ms` }}
                className={[
                  "stagger-in flex min-h-[120px] w-full flex-col justify-between gap-5 rounded-2xl border-2 p-6 text-left transition-all duration-300 md:min-h-[260px] md:p-7",
                  selected
                    ? "-translate-y-1 scale-[1.02] border-navy bg-navy text-white shadow-2xl shadow-navy/30"
                    : "border-line bg-white text-ink hover:-translate-y-1 hover:border-teal hover:shadow-lg active:scale-[0.99]",
                  locked && !selected ? "opacity-40" : ""
                ].join(" ")}
              >
                <div className="flex items-center justify-between">
                  <span
                    className={[
                      "grid h-11 w-11 place-items-center rounded-xl text-lg font-extrabold transition",
                      selected ? "bg-orangeL text-white" : "bg-surface text-navy"
                    ].join(" ")}
                  >
                    {pos + 1}
                  </span>
                  <span className={`flex h-8 items-center gap-1 text-sm font-bold text-orangeL transition-opacity ${selected ? "opacity-100" : "opacity-0"}`}>
                    <CheckIcon /> Selected
                  </span>
                </div>
                <span className="text-lg font-semibold leading-snug md:text-xl">{q.options[code]}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------- Video (player only, no uploads) ---------- */
function VideoPanel({ name, file }) {
  return (
    <section aria-label={`${name} film`} className="overflow-hidden rounded-[2rem] border-2 border-line bg-white shadow-sm">
      <div className="relative aspect-video w-full bg-navy">
        <video
          src={file}
          controls
          playsInline
          preload="metadata"
          className="absolute inset-0 h-full w-full bg-navy object-contain"
        />
      </div>
    </section>
  );
}

/* ---------- Results: winner only, no scores ---------- */
function Results({ pathway, onBack, onRestart }) {
  return (
    <div className="animate-fade-up mx-auto max-w-6xl space-y-8">
      <section
        className="relative overflow-hidden rounded-[2rem] p-8 text-white md:p-14"
        style={{ background: `linear-gradient(135deg, ${pathway.hex} 0%, #0B2A5B 100%)` }}
      >
        <p className="text-base font-semibold opacity-90 md:text-lg">Based on your responses, you aspire for</p>
        <h2 className="mt-3 text-4xl font-extrabold leading-tight tracking-tight md:text-7xl">{pathway.name} scenario</h2>
        <p className="mt-5 text-sm opacity-90 md:text-base">Click play and discover the journey…</p>
      </section>


      <VideoPanel key={pathway.key} pathKey={pathway.key} name={pathway.name} file={pathway.video} />

      <section className="flex flex-col gap-8 rounded-3xl border border-line bg-white p-6 md:flex-row md:items-center md:justify-between md:p-8">
        <QRCard />
        <div className="flex flex-wrap gap-3">
          <button
            type="button"
            onClick={onRestart}
            className="min-h-[60px] rounded-full bg-orange px-9 font-bold text-white shadow-lg shadow-orange/30 transition hover:-translate-y-0.5 hover:bg-orangeDark"
          >
            Restart Game
          </button>
        </div>
      </section>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [screen, setScreen] = useState("landing"); // landing | quiz | result
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState(emptyAnswers);
  const [orders, setOrders] = useState(makeOrders);
  const [locked, setLocked] = useState(false);
  const timer = useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => { window.scrollTo({ top: 0, behavior: "smooth" }); }, [screen, index]);

  const startGame = () => {
    clearTimeout(timer.current);
    setAnswers(emptyAnswers());
    setOrders(makeOrders());
    setIndex(0);
    setLocked(false);
    setScreen("quiz");
  };

  const choose = (code) => {
    if (locked) return;
    const current = index;
    const isLast = current === QUESTIONS.length - 1;
    setAnswers((prev) => {
      const next = [...prev];
      next[current] = code;
      return next;
    });
    setLocked(true);
    timer.current = setTimeout(() => {
      setLocked(false);
      if (isLast) setScreen("result");
      else setIndex(current + 1);
    }, 480);
  };

  const goBack = () => {
    if (locked) return;
    if (screen === "result") {
      setScreen("quiz");
      setIndex(QUESTIONS.length - 1);
    } else if (index > 0) {
      setIndex(index - 1);
    }
  };

  const restart = () => {
    clearTimeout(timer.current);
    setLocked(false);
    setAnswers(emptyAnswers());
    setIndex(0);
    setScreen("landing");
  };

  const pathway = PATHWAYS[winningCode(answers)];

  if (screen === "landing") {
    return (
      <div className="min-h-screen bg-white">
        <div className="bg-navy px-4 py-3">
          <div className="mx-auto flex max-w-6xl flex-wrap items-center justify-center gap-2">
                        <span className="rounded-lg bg-orange px-3 py-1.5 text-xs font-bold text-white md:text-sm">Batch 2025–27</span>
            <span className="rounded-lg bg-orange px-3 py-1.5 text-xs font-bold text-white md:text-sm">Semester 03 | UM4005</span>
          </div>
        </div>
        <Landing onStart={startGame} />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-white">
      <div className="h-1.5 w-full bg-gradient-to-r from-orange via-teal to-navy" />
      <header className="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4 md:px-8">
        <img src={LOGO_SRC} alt="CEPT University, Faculty of Management" className="h-10 w-auto md:h-12" />
      </header>

      <main className="mx-auto max-w-6xl px-5 pb-16 pt-6 md:px-8 md:pt-10">
        {screen === "quiz" && (
          <Quiz
            index={index}
            answers={answers}
            order={orders[index]}
            locked={locked}
            onChoose={choose}
            onBack={goBack}
          />
        )}
        {screen === "result" && <Results pathway={pathway} onBack={goBack} onRestart={restart} />}
      </main>

      <footer className="border-t border-line px-5 py-6 text-center text-sm text-muted">
        Faculty of Management · CEPT University
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
